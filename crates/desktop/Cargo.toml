[package]
name = "formalmusic"
edition.workspace = true
license.workspace = true
version.workspace = true

[build-dependencies]
winresource = "0.1"

[features]
frame-overlay = ["gpui-kit/profiler"]
screenshot = ["gpui-kit/test-support"]
# Demo pages from innertube's recorded responses; dev builds only.
demo-fixtures = ["formalmusic-core/demo-fixtures"]

[dependencies]
formalmusic-api.workspace = true
formalmusic-core.workspace = true
gpui-kit.workspace = true
gpui-base.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
