#:schema ../../../nativedesktop/target/nd/nativedesktop.schema.json
[app]
id = "dev.formalsnake.formalmusic"
display_name = "FormalMusic"
icon = "../../packaging/icon.png"
categories = ["AudioVideo", "Audio", "Player"]

[macos]
minimum_system_version = "14.0"

[linux]
formats = ["appimage"]

[windows]
publisher = "FormalSnake"
installer = { shortcuts = ["start"] }
# scripts/package-windows.ps1 builds kopuzd there; the window starts the copy beside it.
files = ["../../target/kopuzd/bin/kopuzd.exe", "../../packaging/windows/formalmusic.ico"]
