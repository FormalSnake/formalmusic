[package]
name = "formalmusic"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
formalmusic-api = { workspace = true, features = ["settings"] }
formalmusic-core.workspace = true
kopuz-client.workspace = true
nd = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main", features = ["settings-ui"] }
nd-ipc = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
nd-settings = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
schemars = "1.2.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
nd = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main", default-features = false, features = ["build"] }

[dev-dependencies]
nd = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main", features = ["test", "audit"] }
nd-test = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
ndshell = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }

[[bin]]
name = "formalmusic"
path = "src/main.rs"

# The appearance audit owns the main thread (AppKit), so libtest's harness is off.
[[test]]
name = "appearance"
harness = false

# Tier 3: the built app as its own process, driven over its automation socket.
[[test]]
name = "real"
harness = false

[[test]]
name = "look"
harness = false

[[test]]
name = "kopuz"
harness = false
