[package]
name = "formalmusic"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Demo pages from innertube's recorded responses; dev builds only.
demo-fixtures = ["formalmusic-core/demo-fixtures"]

[dependencies]
formalmusic-api = { workspace = true, features = ["settings"] }
formalmusic-core.workspace = true
nd = { path = "../../../nativedesktop/crates/nd", features = ["settings-ui"] }
nd-ipc = { path = "../../../nativedesktop/crates/nd-ipc" }
nd-settings = { path = "../../../nativedesktop/crates/nd-settings" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
schemars = "1.2.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
nd = { path = "../../../nativedesktop/crates/nd", default-features = false, features = ["build"] }

[dev-dependencies]
nd = { path = "../../../nativedesktop/crates/nd", features = ["test", "audit"] }
nd-test = { path = "../../../nativedesktop/crates/nd-test" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
ndshell = { path = "../../../nativedesktop/crates/ndshell" }

[[bin]]
name = "formalmusic"
path = "src/main.rs"

# The appearance audit owns the main thread (AppKit), so libtest's harness is off.
[[test]]
name = "appearance"
harness = false

# Tier 3: the built app as its own process, driven over its automation socket.
[[test]]
name = "real"
harness = false
