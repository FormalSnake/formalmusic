[package]
name = "formalmusic-player"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
formalmusic-api.workspace = true
cpal = "0.18"
crossbeam-channel = "0.5"
reqwest = { workspace = true, features = ["blocking"] }
rtrb = "0.4"
rubato = "5"
serde_json.workspace = true
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mkv", "ogg"] }
symphonia-adapter-libopus = { version = "0.3", default-features = false }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

# Windows has no system libopus to link, so it gets built from source there.
[target.'cfg(windows)'.dependencies]
symphonia-adapter-libopus = { version = "0.3", default-features = false, features = ["bundled"] }

[dev-dependencies]
anyhow.workspace = true
tracing-subscriber.workspace = true
