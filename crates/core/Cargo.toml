[package]
name = "formalmusic-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
formalmusic-api = { workspace = true, features = ["io"] }
tokio.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
parking_lot.workspace = true
dirs.workspace = true
thiserror.workspace = true
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
formalmusic-innertube = { workspace = true, optional = true }

[features]
default = []
# The demo serves innertube's recorded responses where it has one, read from
# the source tree at run time, so it is for dev builds only.
demo-fixtures = ["dep:formalmusic-innertube"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
