[workspace]
resolver = "3"
members = ["crates/api", "crates/innertube", "crates/player", "crates/daemon", "crates/core", "crates/app", "crates/extras"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
formalmusic-api = { path = "crates/api" }
formalmusic-innertube = { path = "crates/innertube" }
formalmusic-player = { path = "crates/player" }
formalmusic-core = { path = "crates/core" }
formalmusic-extras = { path = "crates/extras" }
gpui-kit = "0.6.6"
gpui-base = "0.6.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "cookies", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies change rarely, so optimise them in dev too: decoding audio and
# images unoptimised makes debug builds unusable for judging speed.
[profile.dev.package."*"]
opt-level = 2

# nd's GPUI patch queue (its vendored gpui-pre crates); an app outside nd's workspace has to
# name it, or cargo resolves the unpatched crates.io releases.
[patch.crates-io]
gpui-pre = { path = "../nativedesktop/crates/nd-gpui/vendor/gpui-pre" }
gpui-fast = { path = "../nativedesktop/crates/nd-gpui/vendor/gpui-fast" }
gpui-pre-linux = { path = "../nativedesktop/crates/nd-gpui/vendor/gpui-pre-linux" }
gpui-fast-linux = { path = "../nativedesktop/crates/nd-gpui/vendor/gpui-fast-linux" }
gpui-pre-wgpu = { path = "../nativedesktop/crates/nd-gpui/vendor/gpui-pre-wgpu" }
gpui-fast-wgpu = { path = "../nativedesktop/crates/nd-gpui/vendor/gpui-fast-wgpu" }
