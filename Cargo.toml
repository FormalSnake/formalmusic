[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop", "crates/extras"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
formalmusic-core = { path = "crates/core" }
formalmusic-extras = { path = "crates/extras" }
# Pinned to a rev of FormalSnake/kopuz `ytm/integration`, where the daemon
# work FormalMusic needs is merged ahead of upstream.
kopuz-api = { git = "https://github.com/FormalSnake/kopuz.git", rev = "9f3f2b2a44096b214dfaeb01cc758840948e25e0" }
kopuz-client = { git = "https://github.com/FormalSnake/kopuz.git", rev = "9f3f2b2a44096b214dfaeb01cc758840948e25e0" }
kopuz-config = { git = "https://github.com/FormalSnake/kopuz.git", rev = "9f3f2b2a44096b214dfaeb01cc758840948e25e0" }
kopuz-proto = { git = "https://github.com/FormalSnake/kopuz.git", rev = "9f3f2b2a44096b214dfaeb01cc758840948e25e0" }
gpui-kit = "0.6.6"
gpui-base = "0.6.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "cookies", "http2"] }
tracing = "0.1"
parking_lot = "0.12"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies change rarely, so optimise them in dev too: decoding audio and
# images unoptimised makes debug builds unusable for judging speed.
[profile.dev.package."*"]
opt-level = 2

# Vulkan-only wgpu instance first, GL only as a fallback: creating the GL
# backend maps Mesa's GL stack and LLVM (~59 MB RSS) even when Vulkan wins.
# Same change as https://github.com/zed-industries/zed/pull/63313.
[patch.crates-io]
gpui-pre-wgpu = { path = "patches/gpui-pre-wgpu-0.3.6" }
