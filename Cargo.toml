[workspace]
resolver = "3"
members = ["crates/api", "crates/core", "crates/app", "crates/extras"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
formalmusic-api = { path = "crates/api" }
formalmusic-core = { path = "crates/core" }
formalmusic-extras = { path = "crates/extras" }
# The daemon's client, pinned to the same Kopuz release the flake runs as the daemon: the
# wire is not a stable API and changes with the app.
kopuz-api = { package = "kopuz-api", git = "https://github.com/Kopuz-org/kopuz", tag = "v0.22.0" }
kopuz-client = { package = "kopuz-client", git = "https://github.com/Kopuz-org/kopuz", tag = "v0.22.0" }
kopuz-config = { package = "kopuz-config", git = "https://github.com/Kopuz-org/kopuz", tag = "v0.22.0" }
gpui-kit = "0.6.6"
gpui-base = "0.6.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "cookies", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies change rarely, so optimise them in dev too: decoding audio and
# images unoptimised makes debug builds unusable for judging speed.
[profile.dev.package."*"]
opt-level = 2

# nd's GPUI patch queue (its vendored gpui-pre crates); an app outside nd's workspace has to
# name it, or cargo resolves the unpatched crates.io releases.
[patch.crates-io]
gpui-pre = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-linux = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-linux = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-wgpu = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-wgpu = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
